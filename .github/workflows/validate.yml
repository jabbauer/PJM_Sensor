name: Validate PJM integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install declared HA target and integration requirements
        run: >-
          python -m pip install homeassistant==2026.10.0 numpy==2.3.2
      - name: Offline regressions
        run: python -m unittest discover -s tests -v
      - name: Real HA imports and configuration schemas
        run: python tests/ha_smoke.py
      - name: Syntax
        run: python -m compileall -q custom_components/pjm
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
